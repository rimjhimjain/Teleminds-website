<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 480" width="480" height="480">
  <!-- One sprite, addressed by fragment: <img src="assets/icons.svg#headset"> -->
  <defs>
    <linearGradient id="gW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D3E0F4"/></linearGradient>
    <linearGradient id="gT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AA2FF"/><stop offset="1" stop-color="#0A49B0"/></linearGradient>
    <linearGradient id="gY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE680"/><stop offset="1" stop-color="#F5B800"/></linearGradient>
    <linearGradient id="gR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA596"/><stop offset="1" stop-color="#E4505C"/></linearGradient>
    <radialGradient id="gS"><stop offset="0" stop-color="#060B26" stop-opacity=".38"/><stop offset="1" stop-color="#060B26" stop-opacity="0"/></radialGradient>
    <ellipse id="sh" cx="60" cy="109" rx="34" ry="6" fill="url(#gS)"/>
  </defs>

  <view id="headset" viewBox="0 0 120 120"/>
  <view id="chat" viewBox="120 0 120 120"/>
  <view id="growth" viewBox="240 0 120 120"/>
  <view id="coin" viewBox="360 0 120 120"/>
  <view id="medal" viewBox="0 120 120 120"/>
  <view id="heart" viewBox="120 120 120 120"/>
  <view id="home" viewBox="240 120 120 120"/>
  <view id="globe" viewBox="360 120 120 120"/>
  <view id="pin" viewBox="0 240 120 120"/>
  <view id="flex" viewBox="120 240 120 120"/>
  <view id="docs" viewBox="240 240 120 120"/>
  <view id="target" viewBox="360 240 120 120"/>
  <view id="smile" viewBox="0 360 120 120"/>

  <!-- headset -->
  <g>
    <use href="#sh"/>
    <path d="M25 66a35 35 0 0 1 70 0" fill="none" stroke="#B4CFF6" stroke-width="11" stroke-linecap="round" transform="translate(0 3)"/>
    <path d="M25 66a35 35 0 0 1 70 0" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
    <path d="M96 90q0 15-24 15" fill="none" stroke="#E6F3F4" stroke-width="5" stroke-linecap="round"/>
    <rect x="15" y="56" width="20" height="38" rx="10" fill="url(#gT)"/>
    <rect x="85" y="56" width="20" height="38" rx="10" fill="url(#gT)"/>
    <ellipse cx="21" cy="68" rx="3" ry="8" fill="#fff" opacity=".45"/>
    <ellipse cx="91" cy="68" rx="3" ry="8" fill="#fff" opacity=".45"/>
    <rect x="54" y="98" width="22" height="13" rx="6.5" fill="url(#gY)"/>
    <ellipse cx="61" cy="102" rx="5" ry="2" fill="#fff" opacity=".55"/>
  </g>

  <!-- chat -->
  <g transform="translate(120 0)">
    <use href="#sh"/>
    <path d="M28 64l-5 20 22-16z" fill="#0B5FD6"/>
    <rect x="12" y="18" width="72" height="52" rx="19" fill="url(#gT)"/>
    <ellipse cx="34" cy="28" rx="14" ry="4" fill="#fff" opacity=".3"/>
    <circle cx="34" cy="45" r="5.5" fill="#fff"/><circle cx="48" cy="45" r="5.5" fill="#fff"/><circle cx="62" cy="45" r="5.5" fill="#fff"/>
    <path d="M92 88l9 15-22-12z" fill="#E0A800"/>
    <rect x="50" y="52" width="58" height="42" rx="16" fill="url(#gY)"/>
    <ellipse cx="70" cy="60" rx="12" ry="3.5" fill="#fff" opacity=".45"/>
    <rect x="63" y="67" width="32" height="5.5" rx="2.75" fill="#fff"/>
    <rect x="63" y="78" width="21" height="5.5" rx="2.75" fill="#fff"/>
  </g>

  <!-- growth -->
  <g transform="translate(240 0)">
    <use href="#sh"/>
    <rect x="16" y="72" width="24" height="32" rx="7" fill="url(#gW)"/>
    <rect x="48" y="52" width="24" height="52" rx="7" fill="url(#gT)"/>
    <rect x="80" y="30" width="24" height="74" rx="7" fill="url(#gY)"/>
    <ellipse cx="54" cy="64" rx="2.5" ry="8" fill="#fff" opacity=".4"/>
    <ellipse cx="86" cy="44" rx="2.5" ry="10" fill="#fff" opacity=".5"/>
    <path d="M18 52l26-20 14 8 26-22" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M72 14h16v16" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- coin -->
  <g transform="translate(360 0)">
    <use href="#sh"/>
    <circle cx="60" cy="62" r="38" fill="#D29A00"/>
    <circle cx="60" cy="56" r="38" fill="url(#gY)"/>
    <circle cx="60" cy="56" r="29" fill="none" stroke="#fff" stroke-width="3" opacity=".55"/>
    <ellipse cx="44" cy="34" rx="13" ry="5" fill="#fff" opacity=".5" transform="rotate(-28 44 34)"/>
    <text x="60" y="71" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">₹</text>
  </g>

  <!-- medal -->
  <g transform="translate(0 120)">
    <use href="#sh"/>
    <path d="M38 10l16 36-15 7-14-32z" fill="url(#gT)"/>
    <path d="M82 10l-16 36 15 7 14-32z" fill="url(#gT)"/>
    <circle cx="60" cy="75" r="30" fill="#D29A00"/>
    <circle cx="60" cy="70" r="30" fill="url(#gY)"/>
    <ellipse cx="48" cy="52" rx="10" ry="4" fill="#fff" opacity=".5" transform="rotate(-28 48 52)"/>
    <polygon points="60,54 64.1,64.3 75.2,65.1 66.7,72.2 69.4,82.9 60,77 50.6,82.9 53.3,72.2 44.8,65.1 55.9,64.3" fill="#FFFFFF"/>
  </g>

  <!-- heart -->
  <g transform="translate(120 120)">
    <use href="#sh"/>
    <path d="M60 100C20 74 16 44 36 33c12-6 21 0 24 10 3-10 12-16 24-10 20 11 16 41-24 67z" fill="#C73E4B" transform="translate(0 4)"/>
    <path d="M60 100C20 74 16 44 36 33c12-6 21 0 24 10 3-10 12-16 24-10 20 11 16 41-24 67z" fill="url(#gR)"/>
    <ellipse cx="40" cy="48" rx="6" ry="11" fill="#fff" opacity=".5" transform="rotate(32 40 48)"/>
  </g>

  <!-- home -->
  <g transform="translate(240 120)">
    <use href="#sh"/>
    <rect x="26" y="52" width="68" height="52" rx="10" fill="url(#gW)"/>
    <path d="M16 58L60 20l44 38z" fill="url(#gT)" stroke="url(#gT)" stroke-width="9" stroke-linejoin="round"/>
    <ellipse cx="46" cy="40" rx="3" ry="10" fill="#fff" opacity=".35" transform="rotate(48 46 40)"/>
    <rect x="50" y="72" width="20" height="32" rx="6" fill="url(#gY)"/>
    <circle cx="65" cy="89" r="2" fill="#fff"/>
  </g>

  <!-- globe -->
  <g transform="translate(360 120)">
    <use href="#sh"/>
    <circle cx="60" cy="58" r="37" fill="url(#gT)"/>
    <path d="M38 42q11-10 23-3 7 7-2 14-11 7-21 0-4-6 0-11z" fill="#fff" opacity=".9"/>
    <path d="M63 66q13-5 20 6 2 12-11 14-11-4-9-20z" fill="#fff" opacity=".9"/>
    <ellipse cx="44" cy="34" rx="10" ry="4" fill="#fff" opacity=".35" transform="rotate(-30 44 34)"/>
    <path d="M14 70q46 22 92-24" fill="none" stroke="url(#gY)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="106" cy="46" r="7" fill="url(#gY)"/>
  </g>

  <!-- pin -->
  <g transform="translate(0 240)">
    <use href="#sh"/>
    <path d="M60 106C35 75 28 62 28 47a32 32 0 0 1 64 0c0 15-7 28-32 59z" fill="url(#gT)"/>
    <circle cx="60" cy="47" r="14" fill="url(#gY)"/>
    <ellipse cx="42" cy="34" rx="5" ry="11" fill="#fff" opacity=".4" transform="rotate(32 42 34)"/>
    <ellipse cx="55" cy="41" rx="5" ry="2.5" fill="#fff" opacity=".6"/>
  </g>

  <!-- flex -->
  <g transform="translate(120 240)">
    <use href="#sh"/>
    <path d="M26 56a34 34 0 0 1 60-18" fill="none" stroke="url(#gT)" stroke-width="12" stroke-linecap="round"/>
    <polygon points="96,18 98,48 70,42" fill="#0B5FD6" stroke="#0B5FD6" stroke-width="4" stroke-linejoin="round"/>
    <path d="M94 62a34 34 0 0 1-60 18" fill="none" stroke="url(#gY)" stroke-width="12" stroke-linecap="round"/>
    <polygon points="24,100 22,70 50,76" fill="#F5B800" stroke="#F5B800" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- docs -->
  <g transform="translate(240 240)">
    <use href="#sh"/>
    <rect x="38" y="16" width="56" height="74" rx="11" fill="#A9C8F5" transform="rotate(9 66 53)"/>
    <rect x="24" y="22" width="58" height="78" rx="11" fill="url(#gW)"/>
    <rect x="35" y="37" width="36" height="6.5" rx="3.25" fill="#A9C8F5"/>
    <rect x="35" y="51" width="27" height="6.5" rx="3.25" fill="#A9C8F5"/>
    <rect x="35" y="65" width="32" height="6.5" rx="3.25" fill="#A9C8F5"/>
    <circle cx="84" cy="88" r="17" fill="#D29A00"/>
    <circle cx="84" cy="85" r="17" fill="url(#gY)"/>
    <path d="M76 85l6 6 11-12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- target -->
  <g transform="translate(360 240)">
    <use href="#sh"/>
    <circle cx="56" cy="64" r="40" fill="url(#gW)"/>
    <circle cx="56" cy="64" r="28" fill="url(#gT)"/>
    <circle cx="56" cy="64" r="16" fill="#FFFFFF"/>
    <circle cx="56" cy="64" r="7" fill="url(#gR)"/>
    <path d="M56 64L98 22" stroke="url(#gY)" stroke-width="7" stroke-linecap="round"/>
    <path d="M90 14l2 14 14 2-10 10-14-2-2-14z" fill="url(#gY)"/>
  </g>

  <!-- smile -->
  <g transform="translate(0 360)">
    <use href="#sh"/>
    <circle cx="60" cy="64" r="38" fill="#D29A00"/>
    <circle cx="60" cy="58" r="38" fill="url(#gY)"/>
    <ellipse cx="44" cy="36" rx="13" ry="5" fill="#fff" opacity=".5" transform="rotate(-28 44 36)"/>
    <ellipse cx="47" cy="52" rx="4.5" ry="7" fill="#060B26"/>
    <ellipse cx="73" cy="52" rx="4.5" ry="7" fill="#060B26"/>
    <path d="M42 68q18 18 36 0" fill="none" stroke="#060B26" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
